name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  quality:
    name: Lint, Format, Type Check & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          elif [ -f pyproject.toml ]; then
            pip install -e .
          fi
          # Always ensure dev toolchain is present
          pip install ruff mypy pytest pytest-cov

      - name: Lint (ruff check)
        run: ruff check .

      - name: Format check (ruff format)
        run: ruff format --check .

      - name: Type check (mypy strict)
        run: mypy . --strict --ignore-missing-imports

      - name: Tests (pytest with coverage)
        run: |
          # Pass gracefully when no test files exist yet
          if find . -name 'test_*.py' -o -name '*_test.py' | grep -q .; then
            pytest --cov --cov-report=term-missing
          else
            echo "No test files found — skipping pytest. Add tests as the codebase grows."
          fi

